name: roznoor_app
description: "RozNoor patient mobile app — voice/quick check-ins, timeline, and risk results, backed by the FastAPI service."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # HTTP client with interceptor support (attaches the JWT to every request).
  dio: ^5.9.0
  # JWT storage — Keychain/Keystore-backed on iOS/Android. See conventions.md.
  flutter_secure_storage: ^9.2.4
  # Lightweight state management (ChangeNotifier-based), matches this app's
  # small screen count — see conventions.md.
  provider: ^6.1.5
  # On-device speech-to-text for the Voice Diary screen. See decisions-log.md
  # for why this package was picked.
  speech_to_text: ^7.4.0
  intl: ^0.20.2
  # Raw audio capture for the Voice Diary recording, uploaded alongside the
  # transcript for backend acoustic-signal analysis. Runs alongside
  # speech_to_text — see decisions-log.md (2026-08-25, acoustic-analysis
  # pass) for the concurrent-mic-access caveat and why this is best-effort.
  record: ^5.2.1
  # Local app-private storage location for the recording before upload.
  path_provider: ^2.1.5
  # Persists the Paper/Nocturne theme choice locally across app restarts —
  # a plain UI preference, not a secret, so shared_preferences rather than
  # flutter_secure_storage (see conventions.md, ThemeProvider section).
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Generates the Android/iOS launcher icon files from assets/icon/app_icon.png
  # — see the "flutter_launcher_icons" config below and
  # context/decisions-log.md (2026-08-27). Dev-only, not needed at runtime.
  flutter_launcher_icons: ^0.14.4

# flutter_launcher_icons config — run `dart run flutter_launcher_icons` after
# changing assets/icon/*.png to regenerate every platform size. Master icon
# is a generated (Python/PIL) stylized heartbeat/pulse line in the app's own
# teal brand color (RnColors.accent/accentDark) — see
# context/decisions-log.md for why (no design asset existed yet) and
# scripts/gen_app_icon.py for the generator itself.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F6B68"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Pinned 2026-08-27 while verifying this session's changes: an unconstrained
# `flutter pub get` resolves record_platform_interface to 1.6.0, but the
# Linux platform implementation this app actually uses,
# `record_linux 0.7.2`, only ever implemented the ^1.0.2-era abstract
# interface — its class is missing `startStream` and `hasPermission`'s
# `request` param added in later interface versions, so the app fails to
# even compile on Linux with an unpinned resolution. record 5.2.1 itself
# declares `record_platform_interface: ^1.2.0`, so 1.2.0 is the newest
# version actually compatible with the platform packages this app pulls in
# — not related to anything built this session, but blocked this session's
# own from-scratch `flutter pub get` until pinned. See decisions-log.md.
dependency_overrides:
  # record: ^5.2.1 itself pins record_linux to '>=0.5.0 <1.0.0', but that
  # range (0.7.2 is what actually resolves) only ever implemented the
  # ^1.0.2-era record_platform_interface abstract class. record_android
  # 1.5.2 (the version that actually matters — this is the real device
  # platform) requires record_platform_interface ^1.5.0. The previous fix
  # (pinning record_platform_interface itself down to 1.2.0) "solved" the
  # Linux desktop build but is a blanket override with no per-platform
  # scoping in pubspec.yaml — it silently downgraded the interface for
  # Android too, below what record_android 1.5.2 actually needs. That
  # mismatch is the real root cause of the real-device "Bad state: Cannot
  # add new events after calling close" crashes in AudioRecorder's
  # internal state-stream forwarding (see context/decisions-log.md).
  # Overriding record_linux to 1.3.1 instead fixes the Linux build the
  # same way (it's newer than what record's own constraint allows) while
  # letting record_platform_interface resolve up to a version that
  # actually satisfies record_android's real ^1.5.0 requirement too.
  record_linux: 1.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
