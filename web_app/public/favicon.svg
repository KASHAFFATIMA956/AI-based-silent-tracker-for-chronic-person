<svg width="1024" height="1024" viewBox="173 75 760 760" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tealDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c4a"/>
      <stop offset="100%" stop-color="#1e6b5c"/>
    </linearGradient>
    <linearGradient id="tealMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5f52"/>
      <stop offset="100%" stop-color="#3f8f6a"/>
    </linearGradient>
    <linearGradient id="tealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f7d63"/>
      <stop offset="100%" stop-color="#6fb478"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f8f6a"/>
      <stop offset="100%" stop-color="#8fc57a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7cf8a"/>
      <stop offset="100%" stop-color="#f2b46a"/>
    </linearGradient>
  </defs>

  <!-- Sun rays -->
  <g stroke="#f2b980" stroke-width="16" stroke-linecap="round">
    <line x1="572" y1="118" x2="572" y2="168"/>
    <line x1="466" y1="150" x2="497" y2="192"/>
    <line x1="678" y1="150" x2="647" y2="192"/>
    <line x1="716" y1="272" x2="666" y2="288"/>
    <line x1="722" y1="332" x2="672" y2="332"/>
  </g>
  <!-- Sun -->
  <circle cx="572" cy="290" r="92" fill="url(#sunGrad)"/>

  <!-- Left half of heart: outer swoosh (dark teal) -->
  <path d="M512 700
           C 300 560, 250 400, 320 300
           C 380 215, 500 210, 545 300
           C 495 340, 470 400, 480 460
           C 460 430, 415 410, 375 430
           C 330 455, 320 520, 360 570
           C 400 620, 460 665, 512 700 Z"
        fill="url(#tealDark)"/>

  <!-- Person figure: head -->
  <circle cx="558" cy="428" r="52" fill="url(#tealMid)"/>
  <!-- Person figure: body swoosh -->
  <path d="M558 480
           C 610 490, 640 540, 615 600
           C 590 660, 540 700, 512 760
           C 505 690, 470 630, 500 570
           C 470 590, 430 585, 415 550
           C 470 500, 520 470, 558 480 Z"
        fill="url(#tealMid)"/>

  <!-- Right half of heart: outer swoosh (medium teal) -->
  <path d="M512 700
           C 560 650, 640 610, 700 560
           C 760 508, 790 440, 760 380
           C 735 328, 665 320, 630 365
           C 660 320, 660 260, 610 225
           C 660 190, 745 205, 790 275
           C 840 355, 810 470, 720 555
           C 650 620, 570 665, 512 700 Z"
        fill="url(#tealLight)"/>

  <!-- Medical cross -->
  <g fill="url(#tealMid)">
    <rect x="640" y="440" width="70" height="180" rx="14"/>
    <rect x="585" y="495" width="180" height="70" rx="14"/>
  </g>

  <!-- Leaf at bottom of heart -->
  <path d="M512 760
           C 560 730, 640 700, 720 640
           C 700 720, 630 780, 545 800
           C 525 785, 515 772, 512 760 Z"
        fill="url(#leafGrad)"/>
  <path d="M545 795 C 600 750, 660 705, 715 645"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>

</svg>
